<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">CRAVE-RAG architecture</title>
  <desc id="desc">A PDF becomes a SoftDoc and is retrieved through BM25, text Dense, and visual Dense routes. A Planner, Controller, Environment, specialized Readers, Evidence Checker, and Answerer form a stateful evidence-gated reading loop. Audited decisions support Controller SFT and future DPO.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/></marker>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#0f172a}.label{font-size:20px;font-weight:700}.head{font-size:24px;font-weight:750}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:2.8;fill:none;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1800" height="900" fill="#fff"/>
  <text class="t" x="900" y="48" text-anchor="middle" font-size="34" font-weight="800">CRAVE-RAG</text>
  <text class="t" x="900" y="78" text-anchor="middle" font-size="18" fill="#64748b">Controller-guided Reading and Action Via Evidence Gaps</text>

  <rect x="42" y="112" width="405" height="662" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t head" x="244" y="151" text-anchor="middle">Document and Retrieval</text>
  <rect x="95" y="194" width="300" height="78" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t label" x="245" y="241" text-anchor="middle">Long, visual PDF</text>
  <path class="line" d="M245 272 V322"/>
  <rect x="95" y="324" width="300" height="88" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/>
  <text class="t" x="245" y="378" text-anchor="middle" font-size="27" font-weight="800">SoftDoc</text>
  <path class="line" d="M245 412 V462"/>
  <rect x="70" y="464" width="350" height="216" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="2.5"/>
  <text class="t head" x="245" y="507" text-anchor="middle">Three-route Retrieval</text>
  <rect x="91" y="550" width="96" height="70" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
  <text class="t label" x="139" y="592" text-anchor="middle">BM25</text>
  <rect x="197" y="550" width="96" height="70" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
  <text class="t label" x="245" y="592" text-anchor="middle">Dense</text>
  <rect x="303" y="550" width="96" height="70" rx="14" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
  <text class="t label" x="351" y="592" text-anchor="middle">Visual</text>

  <rect x="485" y="112" width="1273" height="662" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="t head" x="1122" y="151" text-anchor="middle">Stateful Agentic Reading Loop</text>

  <rect x="540" y="195" width="220" height="82" rx="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text class="t label" x="650" y="244" text-anchor="middle">Planner</text>
  <path class="blue" d="M760 236 H865"/>
  <rect x="867" y="183" width="285" height="106" rx="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text class="t" x="1009" y="246" text-anchor="middle" font-size="24" font-weight="800">Controller</text>
  <path class="blue" d="M1152 236 H1260"/>
  <rect x="1262" y="195" width="425" height="82" rx="17" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="t label" x="1474" y="244" text-anchor="middle">Reading Environment</text>

  <path class="line" d="M1474 277 V329"/>
  <rect x="1182" y="331" width="505" height="145" rx="20" fill="#faf5ff" stroke="#a78bfa" stroke-width="2.5"/>
  <text class="t label" x="1434" y="368" text-anchor="middle">Reader Router</text>
  <rect x="1205" y="392" width="135" height="58" rx="12" fill="#fff" stroke="#c4b5fd"/>
  <text class="t" x="1272" y="427" text-anchor="middle" font-size="17" font-weight="700">Text Reader</text>
  <rect x="1353" y="392" width="148" height="58" rx="12" fill="#fff" stroke="#c4b5fd"/>
  <text class="t" x="1427" y="427" text-anchor="middle" font-size="17" font-weight="700">Visual Reader</text>
  <rect x="1514" y="383" width="150" height="76" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text class="t" x="1589" y="414" text-anchor="middle" font-size="16" font-weight="700">Multimodal</text>
  <text class="t" x="1589" y="438" text-anchor="middle" font-size="16" font-weight="700">Table Reader</text>

  <path class="line" d="M1434 476 V521"/>
  <rect x="1262" y="523" width="425" height="78" rx="17" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="t label" x="1474" y="570" text-anchor="middle">Observation</text>
  <path class="line" d="M1262 562 H1150"/>
  <rect x="820" y="510" width="328" height="104" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text class="t" x="984" y="570" text-anchor="middle" font-size="22" font-weight="800">Evidence Checker</text>
  <path class="blue" d="M820 562 H700"/>
  <rect x="540" y="510" width="158" height="104" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="t" x="619" y="570" text-anchor="middle" font-size="18" font-weight="700">Evidence State</text>
  <path class="blue" d="M619 510 C619 374 811 334 944 289"/>

  <path d="M984 614 V668 H1245" fill="none" stroke="#15803d" stroke-width="2.8" marker-end="url(#greenArrow)"/>
  <rect x="1247" y="629" width="220" height="78" rx="17" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text class="t label" x="1357" y="676" text-anchor="middle">Answerer</text>
  <rect x="1500" y="629" width="187" height="78" rx="17" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="t label" x="1593" y="676" text-anchor="middle">Audit Trail</text>
  <path class="line" d="M1467 668 H1500"/>

  <rect x="540" y="650" width="570" height="82" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="t label" x="825" y="681" text-anchor="middle">Post-training</text>
  <text class="t" x="825" y="711" text-anchor="middle" font-size="17">Controller SFT · Future DPO</text>
  <path class="line" d="M1500 707 C1375 755 1232 751 1110 704"/>

  <rect x="42" y="808" width="1716" height="60" rx="16" fill="#0f172a"/>
  <text x="900" y="846" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Finding is not reading. Reading is not believing.</text>
</svg>
