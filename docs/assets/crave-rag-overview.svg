<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="850" viewBox="0 0 1700 850" role="img" aria-labelledby="title desc">
  <title id="title">CRAVE-RAG controller-checker reading loop</title>
  <desc id="desc">Question, SoftDoc, and a persistent candidate pool support a central collaboration loop. The Agentic Controller selects an Action, a Reader creates an Observation, the Evidence Checker updates Evidence Memory and the Active Gap, and the loop continues until the Answerer can respond.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1700" height="850" fill="#ffffff"/>

  <text x="850" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">CRAVE-RAG:</text>
  <text x="850" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#2563eb">Controller-guided Reading and Action Via Evidence Gaps</text>
  <text x="850" y="123" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Start from a clue, follow useful structure, and stop only when the evidence is sufficient.</text>

  <rect x="45" y="225" width="215" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="152" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">QUESTION</text>

  <rect x="45" y="365" width="215" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="152" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">SOFTDOC</text>

  <rect x="45" y="505" width="215" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="152" y="559" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">CANDIDATE POOL</text>

  <rect x="310" y="170" width="1100" height="585" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="860" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#64748b">CONTROLLER-CHECKER COLLABORATION LOOP</text>

  <rect x="370" y="250" width="330" height="145" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="535" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">AGENTIC CONTROLLER</text>
  <text x="535" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Choose the next move</text>

  <rect x="790" y="270" width="180" height="105" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="880" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">ACTION</text>

  <rect x="1060" y="270" width="180" height="105" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="1150" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">READER</text>

  <rect x="1230" y="445" width="245" height="115" rx="20" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2.5"/>
  <text x="1352" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">OBSERVATION</text>

  <rect x="945" y="610" width="300" height="120" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="1095" y="657" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">EVIDENCE CHECKER</text>
  <text x="1095" y="699" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Evaluate evidence progress</text>

  <rect x="470" y="590" width="345" height="140" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="642" y="640" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">EVIDENCE STATE</text>
  <text x="642" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Evidence Memory + Active Gap</text>

  <path d="M260 271 H315 M260 411 H315 M260 551 H315 M315 271 V551" fill="none" stroke="#334155" stroke-width="2.6"/>
  <path d="M315 322 H370" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/>
  <path d="M700 322 H790" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M970 322 H1060" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/>
  <path d="M1150 375 C1150 420 1230 420 1280 445" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/>
  <path d="M1352 560 C1352 615 1285 670 1245 670" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/>
  <path d="M945 670 H815" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M560 590 C500 520 475 455 490 395" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="500" y="477" width="260" height="42" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="630" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">EVIDENCE INCOMPLETE: CONTINUE</text>

  <path d="M1245 700 H1510" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="1510" y="642" width="155" height="116" rx="20" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/>
  <text x="1587" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">SUFFICIENT</text>
  <text x="1587" y="724" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">ANSWER</text>

  <text x="850" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">The Checker maintains the gap; the Controller decides how to close it.</text>
</svg>
