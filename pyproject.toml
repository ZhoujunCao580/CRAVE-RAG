[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-structured-document"
version = "0.1.0"
description = "Parser-neutral soft document structure for multimodal PDFs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.5,<3",
    "Pillow>=9,<12",
    "pypdfium2>=4.30,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
mineru = [
    "mineru[pipeline]==3.4.4",
    # MinerU 3.4.4 imports six in its pipeline OCR code but omits it from
    # the published dependency metadata.
    "six>=1.16,<2",
]

[project.scripts]
softdoc = "softdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
