[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-structured-document"
version = "0.1.0"
description = "CRAVE-RAG: controller-guided reading and action via evidence gaps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.5,<3",
    "Pillow>=9,<12",
    "pypdf>=4,<7",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
dense = [
    "torch>=2.2",
    # sentence-transformers 6.x (required by MultiVectorEncoder) uses the
    # Transformers 5.x API.
    "transformers>=5,<6",
]
visual-retrieval = [
    "torch>=2.2",
    # MultiVectorEncoder (used by ColSmol visual retrieval) was introduced in
    # sentence-transformers 6.0; older 5.x installs fail at runtime.
    "sentence-transformers[image]>=6.0,<7",
    # ColSmol is distributed as a PEFT adapter and needs PEFT at load time.
    "peft>=0.12,<1",
]
train = [
    "accelerate>=0.30,<2",
    "datasets>=2.18,<5",
    "peft>=0.12,<1",
    "bitsandbytes>=0.43,<1; platform_system == 'Linux'",
]
mineru = [
    "mineru[pipeline]==3.4.4",
    # MinerU 3.4.4 imports six in its pipeline OCR code but omits it from
    # the published dependency metadata.
    "six>=1.16,<2",
]

[project.scripts]
softdoc = "softdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
softdoc = [
    "prompts/*.txt",
    "prompts/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
